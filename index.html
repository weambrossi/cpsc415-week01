<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrics Trainer</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfcf8;
      color: #1a1a1a;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      max-width: 40rem;
      padding: 2rem 1rem;
      text-align: center;
    }
    .portrait {
      display: block;
      width: 14rem;
      max-width: 70%;
      height: 12rem;
      object-fit: contain;
      margin: 0 auto 1.5rem;
    }
    #line {
      font-size: 1.75rem;
      line-height: 1.5;
      min-height: 5.25rem;
      margin: 0 0 1rem;
    }
    #counter {
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      color: #444;
      margin: 0 0 1.5rem;
    }
    button {
      font: inherit;
      font-family: system-ui, sans-serif;
      font-size: 1.125rem;
      padding: 0.6rem 1.5rem;
      border: 2px solid #1a1a1a;
      border-radius: 6px;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    button:hover {
      background: #333;
    }
    button:focus-visible {
      outline: 3px solid #1f5fd6;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img id="portrait" class="portrait" alt="Ink drawing of William Shakespeare">
    <p id="line" aria-live="polite"></p>
    <p id="counter"></p>
    <div class="controls">
      <button id="previous" type="button">Previous</button>
      <button id="next" type="button">Next</button>
    </div>
  </main>

    const poem = `Shall I compare thee to a summer's day?
Thou art more lovely and more temperate:
Rough winds do shake the darling buds of May,
And summer's lease hath all too short a date;
Sometime too hot the eye of heaven shines,
And often is his gold complexion dimm'd;
And every fair from fair sometime declines,
By chance or nature's changing course untrimm'd;
But thy eternal summer shall not fade,
Nor lose possession of that fair thou ow'st;
Nor shall death brag thou wander'st in his shade,
When in eternal lines to time thou grow'st:
So long as men can breathe or eyes can see,
So long lives this, and this gives life to thee.`;

    let portraitIndex = 0;
    const previousBtn = document.getElementById("previous");
    const nextBtn = document.getElementById("next");

    function render() {
      lineEl.textContent = lines[index];
      counterEl.textContent = `Line ${index + 1} of ${lines.length}`;
    }

    // Each Previous or Next click switches to the other Shakespeare drawing.
    function swapPortrait() {
      portraitIndex = (portraitIndex + 1) % portraits.length;
      portraitEl.src = portraits[portraitIndex];
    }

    nextBtn.addEventListener("click", () => {
      index = (index + 1) % lines.length;
      render();
      swapPortrait();
    });

    // Previous on the first line wraps around to the last line.
    previousBtn.addEventListener("click", () => {
      index = (index - 1 + lines.length) % lines.length;
      render();
      swapPortrait();
    });

    portraitEl.src = portraits[portraitIndex];
    render();
  </script>
